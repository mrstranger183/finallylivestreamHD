<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
    <title>TG:@FINALLY-LIVE</title>
    <meta name="monetag" content="471040bfe79cfb457e3d783bdfd6bac1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #fff;
            --text: #14171c;
            --muted: #5d6673;
            --border: #e2e5ea;
            --primary: #1a56db;
            --primary-hover: #1546b3;
            --live: #d92d20;
            --ok: #067647;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1115;
                --surface: #171a20;
                --text: #f1f3f6;
                --muted: #9aa3b0;
                --border: #2a2f38;
                --primary: #4c82f7;
                --primary-hover: #6b97f9;
                --live: #f26457;
                --ok: #4ade80;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light dark;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        button,
        a {
            touch-action: manipulation;
        }

        /* Header */
        .header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: max(.6rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .25rem max(1rem, env(safe-area-inset-left));
        }

        .header-inner {
            width: 100%;
            padding: .8rem 1rem .8rem .8rem;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px -10px rgba(15, 23, 42, .25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .75rem;
            color: var(--text);
            text-decoration: none;
            min-width: 0;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            background: linear-gradient(145deg, #37aee2, #1e96d6);
            box-shadow: 0 3px 10px rgba(34, 158, 217, .35);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.2;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -.01em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .brand-name em {
            font-style: normal;
            color: #229ed9;
        }

        .brand-sub {
            font-size: .8rem;
            color: var(--muted);
            font-weight: 500;
        }

        .status {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-shrink: 0;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--live);
            background: color-mix(in srgb, var(--live) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--live) 35%, transparent);
            border-radius: 999px;
            padding: .25rem .7rem;
        }

        .live::before {
            content: '';
            width: .45rem;
            height: .45rem;
            border-radius: 50%;
            background: currentColor;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            50% {
                opacity: .3;
            }
        }

        .viewers {
            font-size: .8rem;
            font-weight: 500;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            white-space: nowrap;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .25rem .7rem;
        }

        .viewers b {
            color: var(--text);
            font-weight: 600;
        }

        /* Main */
        .main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: .75rem 1rem 2rem;
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }

        .player {
            aspect-ratio: 16 / 9;
            width: 100%;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .player iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .panel {
            margin-top: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-top {
            padding: 1.1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tg-badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            color: #fff;
            background: linear-gradient(145deg, #37aee2, #1e96d6);
            box-shadow: 0 4px 12px rgba(34, 158, 217, .3);
        }

        .panel-copy {
            flex: 1;
            min-width: 0;
        }

        .panel h1 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .panel p {
            font-size: .875rem;
            color: var(--muted);
        }

        .tip {
            display: flex;
            align-items: center;
            gap: .55rem;
            padding: .7rem 1.25rem;
            font-size: .8rem;
            color: var(--muted);
            background: color-mix(in srgb, var(--muted) 7%, transparent);
            border-top: 1px solid var(--border);
        }

        .tip i {
            color: var(--primary);
        }

        .actions {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            min-height: 44px;
            padding: .6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font: 600 .9rem 'Inter', sans-serif;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            transition: background .15s, border-color .15s;
        }

        .btn:hover {
            border-color: var(--muted);
        }

        .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn.done {
            color: var(--ok);
            border-color: var(--ok);
        }

        .btn:focus-visible,
        .brand:focus-visible,
        .dlg-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Brand footer (original pill link) */
        .brand-footer {
            text-align: center;
            margin-top: 1.25rem;
            padding: 0 0 .75rem;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            max-width: 100%;
            padding: .35rem .75rem;
            border-radius: 999px;
            text-decoration: none;
            text-align: center;
            font-size: .72rem;
            font-weight: 500;
            letter-spacing: .01em;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            opacity: .65;
            transition: opacity .2s, color .2s, border-color .2s;
        }

        .brand-link:hover,
        .brand-link:focus-visible {
            opacity: 1;
            color: var(--primary);
            border-color: color-mix(in srgb, var(--primary) 40%, transparent);
        }

        .brand-link:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .safe-bottom {
            height: env(safe-area-inset-bottom);
        }

        /* Telegram popup (small, white) */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            background: rgba(15, 23, 42, .45);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .overlay.open {
            display: flex;
        }

        .dialog {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            max-height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: #fff;
            color: #14171c;
            border: 1px solid #e6e9ee;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .25);
            animation: pop .3s cubic-bezier(.2, .9, .3, 1.1);
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.95) translateY(8px);
            }
        }

        .dlg-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            color: #fff;
            background: linear-gradient(145deg, #37aee2, #1e96d6);
            box-shadow: 0 8px 20px rgba(34, 158, 217, .35);
        }

        .dialog h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: .4rem;
        }

        .dialog p {
            color: #5d6673;
            font-size: 1rem;
            line-height: 1.55;
            margin: 0 auto 1.4rem;
            max-width: 30ch;
        }

        .dlg-row {
            display: flex;
            gap: .6rem;
        }

        .dlg-btn {
            flex: 1;
            min-height: 46px;
            padding: .75rem .5rem;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            font: 600 .95rem 'Inter', sans-serif;
            text-align: center;
            border: 1px solid transparent;
            transition: background .15s, box-shadow .15s;
        }

        .dlg-x {
            position: absolute;
            top: .75rem;
            right: .75rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #f1f3f6;
            color: #5d6673;
            border: 0;
            font-size: 1rem;
            transition: background .15s, color .15s;
        }

        .dlg-x:hover {
            background: #e3e6eb;
            color: #14171c;
        }

        .dlg-x:focus-visible {
            outline: 2px solid #229ed9;
            outline-offset: 2px;
        }

        .dlg-btn.ghost {
            background: #f1f3f6;
            color: #3b4452;
            border-color: #e6e9ee;
        }

        .dlg-btn.ghost:hover {
            background: #e7eaef;
        }

        .dlg-btn.join {
            background: #229ed9;
            color: #fff;
            box-shadow: 0 4px 12px rgba(34, 158, 217, .35);
        }

        .dlg-btn.join:hover {
            background: #1b8fc6;
        }

        /* States */
        .state {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            text-align: center;
            color: var(--muted);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .state h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .state h2 i {
            color: var(--live);
            margin-right: .4rem;
        }

        .state p {
            max-width: 38ch;
        }

        @media (max-width: 600px) {
            .header {
                padding-left: max(.75rem, env(safe-area-inset-left));
                padding-right: max(.75rem, env(safe-area-inset-right));
            }

            .main {
                padding: .75rem max(.75rem, env(safe-area-inset-right)) 1.5rem max(.75rem, env(safe-area-inset-left));
            }

            .player {
                border-radius: 6px;
            }

            .panel-top {
                flex-wrap: wrap;
                padding: 1rem;
                gap: .85rem;
            }

            .panel-copy {
                flex: 1 1 calc(100% - 62px);
            }

            .actions {
                flex: 1 1 100%;
                flex-wrap: nowrap;
            }

            .actions .btn {
                flex: 1;
                padding: .75rem .5rem;
            }

            .tip {
                padding: .65rem 1rem;
            }

            .brand-link {
                font-size: .65rem;
                padding: .3rem .65rem;
            }

            .dialog {
                padding: 1.75rem 1.25rem 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .brand-icon {
                width: 42px;
                height: 42px;
                font-size: 1.15rem;
            }

            .brand-name {
                font-size: 1.05rem;
            }

            .brand {
                gap: .55rem;
            }

            .viewers .w {
                display: none;
            }

            .viewers,
            .live {
                padding: .2rem .55rem;
                font-size: .75rem;
            }
        }

        @media (max-width: 360px) {
            .brand-sub {
                display: none;
            }

            .tg-badge {
                width: 40px;
                height: 40px;
                font-size: 1.15rem;
            }

            .panel h1 {
                font-size: 1rem;
            }

            .panel-copy {
                flex: 1 1 calc(100% - 56px);
            }

            .dlg-row {
                flex-direction: column;
            }
        }

        @media (max-height: 480px) and (orientation: landscape) {
            .main {
                padding-top: .75rem;
            }

            .dialog {
                padding: 1.25rem 1.25rem 1rem;
            }

            .dlg-icon {
                width: 52px;
                height: 52px;
                font-size: 1.4rem;
                margin-bottom: .6rem;
            }

            .dialog h2 {
                font-size: 1.15rem;
            }

            .dialog p {
                margin-bottom: .9rem;
                font-size: .9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="https://t.me/+4dadpTmOImQzOWE1" target="_blank" rel="noopener noreferrer">
                <span class="brand-icon"><i class="fa-brands fa-telegram"></i></span>
                <span class="brand-text">
                    <span class="brand-name">@finally-live</span>
                    <span class="brand-sub">Live on Telegram</span>
                </span>
            </a>
            <div class="status" id="status" hidden>
                <span class="viewers" id="viewers" hidden><i class="fa-regular fa-eye"></i><b
                        id="viewerCount">0</b><span class="w">views</span></span>
                <span class="live">LIVE</span>
            </div>
        </div>
    </header>

    <main class="main" id="app">
        <div class="state" role="status">
            <div class="spinner"></div>
            <p>Loading stream…</p>
        </div>
    </main>



    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <div class="dialog">
            <button class="dlg-x" id="dlgX" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <div class="dlg-icon"><i class="fa-solid fa-paper-plane"></i></div>
            <h2 id="dlgTitle">Join Telegram Channel</h2>
            <p>Get match links &amp; live updates delivered straight to your phone.</p>
            <div class="dlg-row">
                <button class="dlg-btn ghost" id="dlgClose" type="button">Already Joined</button>
                <a class="dlg-btn join" href="https://t.me/+4dadpTmOImQzOWE1" target="_blank"
                    rel="noopener noreferrer">Join Now</a>
            </div>
        </div>
    </div>

    <script>
        /* Views-today counter (Firebase Realtime Database, no SDK needed).
           Leave the URL empty to hide the counter. */
        const FIREBASE_DB_URL = 'https://streamxcricket-default-rtdb.asia-southeast1.firebasedatabase.app';

        const app = document.getElementById('app');
        const overlay = document.getElementById('overlay');
        let streamId = '';

        async function init() {
            try {
                const res = await fetch('https://cust-1zx.pages.dev/links.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                streamId = new URLSearchParams(location.search).get('id');
                const stream = data.iframes.find(i => i.id === streamId);
                if (stream) {
                    document.title = '@finally-live';
                    renderPlayer(stream);
                    startViewerCount();
                    setTimeout(() => overlay.classList.add('open'), 2000);
                } else {
                    renderError('Stream not found', 'This stream ID is invalid or the stream is offline. Check the link and try again.');
                }
            } catch (e) {
                console.error(e);
                renderError('Couldn’t load the stream', 'Check your internet connection and reload the page.');
            }
        }

        function renderPlayer(data) {
            app.innerHTML = `
    <div class="player" id="player"></div>
    <section class="panel">
      <div class="panel-top">
        <div class="tg-badge"><i class="fa-brands fa-telegram"></i></div>
        <div class="panel-copy">
          <h1>Join our Telegram channel</h1>
          <p>Match links, live updates and highlights, first on Telegram.</p>
        </div>
        <div class="actions">
          <a class="btn primary" href="https://t.me/+4dadpTmOImQzOWE1" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-telegram"></i> Join Telegram
          </a>
          <button class="btn" id="shareBtn" type="button">
            <i class="fa-solid fa-share-nodes"></i> <span>Share</span>
          </button>
        </div>
      </div>
      <div class="tip"><i class="fa-solid fa-circle-info"></i> Video stuck or buffering? Reload the page or try again in a moment.</div>
    </section>
    <div class="safe-bottom"></div>`;

            const f = document.createElement('iframe');
            f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
            f.setAttribute('allowfullscreen', '');
            f.setAttribute('title', 'Live stream');
            f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-forms');
            f.src = data.iframeSrc;
            document.getElementById('player').appendChild(f);
            document.getElementById('shareBtn').addEventListener('click', shareLink);
            document.getElementById('status').hidden = false;
        }

        function renderError(title, msg) {
            document.title = 'Error - ' + title;
            app.innerHTML = `<div class="state" role="alert"><h2><i class="fa-solid fa-triangle-exclamation"></i>${title}</h2><p>${msg}</p></div>`;
        }

        /* Opens the phone's share sheet; falls back to copying the link */
        async function shareLink() {
            const btn = document.getElementById('shareBtn');
            const label = btn.querySelector('span');
            const icon = btn.querySelector('i');
            const payload = { title: 'Watch live', text: 'Watch the match live here:', url: location.href };
            try {
                if (navigator.share) {
                    await navigator.share(payload);
                    return;
                }
                await navigator.clipboard.writeText(location.href);
                btn.classList.add('done');
                icon.className = 'fa-solid fa-check';
                label.textContent = 'Link copied';
                setTimeout(() => {
                    btn.classList.remove('done');
                    icon.className = 'fa-solid fa-share-nodes';
                    label.textContent = 'Share';
                }, 2000);
            } catch (e) {
                if (e && e.name !== 'AbortError') console.error('Share failed', e);
            }
        }

        /* Views today: +1 per visitor per day (not per refresh), shown to everyone.
           Uses plain REST calls, so there is no 100-connection limit to hit. */
        async function startViewerCount() {
            if (!FIREBASE_DB_URL) return;
            const box = document.getElementById('viewers');
            const num = document.getElementById('viewerCount');
            const base = FIREBASE_DB_URL.replace(/\/$/, '');
            const day = new Date(Date.now() + 19800000).toISOString().slice(0, 10); /* IST date */
            const key = String(streamId).replace(/[.#$\[\]\/]/g, '_');
            const url = base + '/views/' + key + '/' + day + '.json';
            const flag = 'counted:' + key + ':' + day;

            async function show() {
                try {
                    const r = await fetch(url);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const n = await r.json();
                    num.textContent = Number(n || 0).toLocaleString();
                    box.hidden = false;
                } catch (e) { box.hidden = true; }
            }

            let counted = false;
            try { counted = localStorage.getItem(flag) === '1'; } catch (e) { }
            if (!counted) {
                try {
                    const r = await fetch(url, { method: 'PUT', body: JSON.stringify({ '.sv': { increment: 1 } }) });
                    if (r.ok) { try { localStorage.setItem(flag, '1'); } catch (e) { } }
                } catch (e) { console.error('Count failed', e); }
            }
            show();
            setInterval(() => { if (!document.hidden) show(); }, 60000);
        }

        document.getElementById('dlgClose').addEventListener('click', () => overlay.classList.remove('open'));
        document.getElementById('dlgX').addEventListener('click', () => overlay.classList.remove('open'));
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });
        document.addEventListener('DOMContentLoaded', init);

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) e.preventDefault();
            if (e.ctrlKey && e.key === 'u') e.preventDefault();
        });
    </script>
</body>

</html>
